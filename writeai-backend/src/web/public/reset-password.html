<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Writect</title>
  <link rel="icon" type="image/png" href="/img/Writect-logo-icon.png">
  <script>
    (function () {
      var t = localStorage.getItem('writeai_web_theme') || 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
  <div class="login-card">
    <a href="/" class="logo" aria-label="Writect AI">
      <img class="logo-img" src="/img/Writect-AI-logo.png" alt="Writect AI" width="180" height="40">
    </a>
    <h1>Choose a new password</h1>
    <p class="sub">Enter a new password for your Writect account.</p>
    <div id="login-error" class="login-error"></div>
    <div id="login-success" class="login-success"></div>
    <form id="reset-form" class="auth-form">
      <label class="auth-label" for="reset-password">New password</label>
      <input id="reset-password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
      <label class="auth-label" for="reset-password2">Confirm password</label>
      <input id="reset-password2" type="password" required minlength="8" autocomplete="new-password" placeholder="Repeat password">
      <button type="submit" class="btn-auth-primary" id="reset-submit">Update password</button>
    </form>
    <a href="/login" class="login-back">← Back to sign in</a>
  </div>
  <script src="/js/config.js"></script>
  <script>
    (function () {
      const apiBase = window.WRITEAI_API_BASE || '';
      const params = new URLSearchParams(location.search);
      const token = params.get('token') || '';
      const errEl = document.getElementById('login-error');
      const okEl = document.getElementById('login-success');

      if (!token) {
        errEl.textContent = 'This reset link is missing or invalid. Request a new one from the sign-in page.';
        errEl.classList.add('show');
        document.getElementById('reset-form').classList.add('hidden');
      }

      document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.classList.remove('show');
        okEl.classList.remove('show');
        const p1 = document.getElementById('reset-password').value;
        const p2 = document.getElementById('reset-password2').value;
        if (p1 !== p2) {
          errEl.textContent = 'Passwords do not match.';
          errEl.classList.add('show');
          return;
        }
        const btn = document.getElementById('reset-submit');
        btn.disabled = true;
        try {
          const res = await fetch(`${apiBase}/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password: p1 })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            errEl.textContent = data.message || 'Could not reset password.';
            errEl.classList.add('show');
            return;
          }
          okEl.textContent = data.message || 'Password updated. You can sign in now.';
          okEl.classList.add('show');
          setTimeout(() => { location.href = '/login'; }, 1200);
        } catch {
          errEl.textContent = 'Network error. Please try again.';
          errEl.classList.add('show');
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
